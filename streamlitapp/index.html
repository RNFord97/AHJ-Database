<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CA AHJ Building Department Staffing — 2024</title>

  <!-- stlite required stylesheet (provides Streamlit's base UI styles) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.7.2/build/stlite.css" />

  <style>
    /* ── Reset & base ──────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #0f172a; }
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

    /* ── Streamlit root: full viewport ─────────────────── */
    #root { width: 100vw; height: 100vh; }

    /* ── Loading overlay ────────────────────────────────── */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      transition: opacity 0.6s ease;
    }

    /* Orange spinner ring */
    .spinner-ring {
      width: 56px;
      height: 56px;
      border: 4px solid #1e293b;
      border-top-color: #f97316;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 28px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    #loading-status {
      font-size: 0.875rem;
      color: #f97316;
      font-weight: 500;
      min-height: 1.4em;
      text-align: center;
      margin-bottom: 8px;
    }

    .loading-sub {
      font-size: 0.72rem;
      color: #475569;
      text-align: center;
      max-width: 320px;
    }

    /* Animated dots after "engine" text */
    .dot-pulse::after {
      content: '';
      animation: dots 1.5s steps(3, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      33%  { content: '.'; }
      66%  { content: '..'; }
      100% { content: '...'; }
    }

    /* Progress bar strip */
    .boot-bar-track {
      width: 240px;
      height: 3px;
      background: #1e293b;
      border-radius: 9999px;
      margin-top: 24px;
      overflow: hidden;
    }
    .boot-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f97316, #fb923c);
      border-radius: 9999px;
      transition: width 6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* Badge row */
    .tech-badges {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 9999px;
      border: 1px solid #334155;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- ── Loading Screen ──────────────────────────────────────
       Visible while stlite downloads Pyodide (~7 MB WASM) and
       installs pandas + plotly. Fades out when Streamlit renders.
  ─────────────────────────────────────────────────────────── -->
  <div id="loading-screen">
    <div class="spinner-ring"></div>
    <p class="loading-title">CA AHJ Staffing Dashboard</p>
    <p id="loading-status" class="dot-pulse">Booting WebAssembly engine</p>
    <p class="loading-sub">Streamlit runs entirely in your browser via Pyodide&nbsp;— no server needed.<br>First load takes 20–40 s; subsequent loads are cached.</p>
    <div class="boot-bar-track">
      <div class="boot-bar-fill" id="boot-bar"></div>
    </div>
    <div class="tech-badges">
      <span class="badge">stlite 1.7.2</span>
      <span class="badge">Pyodide</span>
      <span class="badge">Streamlit</span>
      <span class="badge">Plotly</span>
    </div>
  </div>

  <!-- ── Streamlit mount target ──────────────────────────── -->
  <div id="root"></div>

  <!-- stlite browser: Streamlit-in-WebAssembly runtime.
       @stlite/browser@1.7.2 is a pure ES module — must use type="module"
       with a named import. A plain <script src> produces no globals.       -->
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.7.2/build/stlite.js";

    // ── Loading screen: progress bar + rolling status messages ──────────────

    const loadingEl  = document.getElementById('loading-screen');
    const statusEl   = document.getElementById('loading-status');
    const bootBar    = document.getElementById('boot-bar');
    const rootEl     = document.getElementById('root');

    // Animate the progress bar to give a sense of progress
    setTimeout(() => { bootBar.style.width = '15%'; }, 100);

    const steps = [
      [500,   'Loading Python runtime (Pyodide)',   25],
      [8000,  'Unpacking standard library',          45],
      [16000, 'Installing pandas',                   60],
      [22000, 'Installing plotly',                   75],
      [30000, 'Starting Streamlit',                  88],
      [40000, 'Almost ready',                        95],
    ];

    const timers = steps.map(([delay, msg, pct]) =>
      setTimeout(() => {
        if (statusEl) statusEl.textContent = msg;
        if (bootBar)  bootBar.style.width  = pct + '%';
      }, delay)
    );

    // Hide loading screen as soon as stlite renders its first child element
    const observer = new MutationObserver(() => {
      if (rootEl.children.length > 0) {
        observer.disconnect();
        timers.forEach(clearTimeout);
        bootBar.style.transition = 'none';
        bootBar.style.width = '100%';
        loadingEl.style.opacity = '0';
        setTimeout(() => loadingEl.remove(), 650);
      }
    });
    observer.observe(rootEl, { childList: true });

    // ── stlite mount ─────────────────────────────────────────────────────────
    mount(
      {
        requirements: ['pandas', 'plotly'],

        entrypoint: 'app.py',

        files: {
          /*
           * Fetch the processed CSV from the repo and map it into
           * Pyodide's virtual file system so pd.read_csv() can open it.
           * The relative URL resolves correctly on GitHub Pages:
           *   streamlitapp/index.html → ../data/processed/...
           */
          'AHJ_BD_Staffing_2024.csv': {
            url: '../data/processed/AHJ_BD_Staffing_2024.csv',
          },

          // ─── Main Streamlit application ────────────────────────────────────
          //
          // IMPORTANT: this string is a JS template literal (backtick-delimited).
          // Python code must avoid the  ${  pattern (template-literal interpolation).
          // Dollar amounts are written as  "$" + f"{value:,.0f}"  to prevent this.
          // ──────────────────────────────────────────────────────────────────────
          'app.py': `
import streamlit as st
import pandas as pd
import plotly.express as px

# ── Page config ────────────────────────────────────────────────────────────────
st.set_page_config(
    page_title="CA AHJ BD Staffing 2024",
    page_icon="🏗",
    layout="wide",
    initial_sidebar_state="expanded",
)

# ── Dark theme CSS overrides ───────────────────────────────────────────────────
st.markdown("""
<style>
  .stApp,
  [data-testid="stAppViewContainer"] { background-color: #0f172a !important; }
  section[data-testid="stSidebar"]   { background-color: #0f172a !important;
                                        border-right: 1px solid #1e293b; }
  [data-testid="stMetricValue"]      { color: #f97316 !important; font-size: 1.5rem !important; }
  [data-testid="stMetricLabel"]      { color: #94a3b8 !important; font-size: 0.75rem !important; }
  h1, h2, h3                         { color: #f1f5f9 !important; }
  .stDivider                         { border-color: #1e293b !important; }
  [data-testid="stCaption"]          { color: #64748b !important; }
</style>
""", unsafe_allow_html=True)


# ── Data loading ───────────────────────────────────────────────────────────────
@st.cache_data
def load_data():
    df = pd.read_csv("AHJ_BD_Staffing_2024.csv")

    df["BD_STAFF_COUNT"]       = pd.to_numeric(df["BD_STAFF_COUNT"],       errors="coerce").fillna(0).astype(int)
    df["BD_STAFF_TOTAL_WAGES"] = pd.to_numeric(df["BD_STAFF_TOTAL_WAGES"], errors="coerce").fillna(0.0)
    df["EmployerPopulation"]   = pd.to_numeric(df["EmployerPopulation"],   errors="coerce").fillna(0.0)
    df["EmployerCounty"]       = df["EmployerCounty"].fillna("").str.strip()
    df["TYPE"]                 = df["TYPE"].fillna("CITY").str.strip()

    # Keep only AHJs with at least one staff member recorded
    return df[df["BD_STAFF_COUNT"] > 0].reset_index(drop=True)

df = load_data()

# ── Colour map shared by both charts ──────────────────────────────────────────
COLOR_MAP = {"CITY": "#f97316", "COUNTY": "#06b6d4", "TOWNS": "#8b5cf6"}
DARK_LAYOUT = dict(
    paper_bgcolor="rgba(0,0,0,0)",
    plot_bgcolor="rgba(15,23,42,0.5)",
    font=dict(color="#94a3b8", family="Inter, ui-sans-serif, system-ui, sans-serif"),
    title_font=dict(color="#f1f5f9", size=15),
    legend=dict(font=dict(color="#94a3b8"), bgcolor="rgba(0,0,0,0)"),
    margin=dict(l=0, r=16, t=52, b=16),
)
AXIS_STYLE = dict(gridcolor="#1e293b", showline=False, tickcolor="#334155",
                  tickfont=dict(color="#64748b"))


# ── Sidebar ────────────────────────────────────────────────────────────────────
with st.sidebar:
    st.markdown("### 🏗 AHJ Staffing")
    st.caption("CA Building Departments · 2024")
    st.divider()

    # County filter – "All" checkbox avoids a 51-item default list
    counties = sorted(df["EmployerCounty"].unique())
    all_counties = st.checkbox("All Counties", value=True)
    if all_counties:
        selected_counties = counties
    else:
        selected_counties = st.multiselect(
            "Select Counties", counties,
            placeholder="Choose one or more counties…"
        )

    st.divider()

    # AHJ type toggle
    types = sorted(df["TYPE"].unique())
    selected_types = st.multiselect("AHJ Type", types, default=types)

    st.divider()

    # Minimum staff slider
    min_staff = st.slider("Min. Staff Count", min_value=0, max_value=150,
                          value=0, step=1)

    st.divider()
    st.caption("Tip: hover over any chart element for details.")


# ── Apply filters ──────────────────────────────────────────────────────────────
if not selected_counties or not selected_types:
    st.warning("Select at least one county and one AHJ type in the sidebar.")
    st.stop()

mask = (
    df["EmployerCounty"].isin(selected_counties) &
    df["TYPE"].isin(selected_types) &
    (df["BD_STAFF_COUNT"] >= min_staff)
)
filtered = df[mask].copy()

if filtered.empty:
    st.warning("No jurisdictions match the current filters. Try widening your selection.")
    st.stop()


# ── Header ─────────────────────────────────────────────────────────────────────
st.markdown("## CA AHJ Building Department Staffing")
st.caption("2024 · Statewide · California Energy Commission")


# ── KPI metrics ────────────────────────────────────────────────────────────────
total_wages = filtered["BD_STAFF_TOTAL_WAGES"].sum()
# Build wages string — note: "$" and f"{}" are kept separate to avoid the dollar-brace
wages_str = ("$" + f"{total_wages / 1_000_000:.1f}M") if total_wages >= 1_000_000 \
            else ("$" + f"{total_wages:,.0f}")

c1, c2, c3, c4 = st.columns(4)
c1.metric("Jurisdictions",   f"{len(filtered):,}")
c2.metric("Total BD Staff",  f"{filtered['BD_STAFF_COUNT'].sum():,}")
c3.metric("Avg Staff / AHJ", f"{filtered['BD_STAFF_COUNT'].mean():.1f}")
c4.metric("Total Wages",     wages_str)

st.divider()


# ── Chart 1 – Horizontal bar: Top 20 AHJs by staff count ──────────────────────
st.subheader("Top 20 AHJs by Building Department Staff Count")

top20 = filtered.nlargest(20, "BD_STAFF_COUNT").copy()

# Pre-format wages for hover tooltip (same pattern: "$" + f"{...}")
top20["wages_fmt"] = top20["BD_STAFF_TOTAL_WAGES"].apply(
    lambda v: ("$" + f"{v / 1_000_000:.1f}M") if v >= 1_000_000 else ("$" + f"{v:,.0f}")
)

fig_bar = px.bar(
    top20,
    x="BD_STAFF_COUNT",
    y="BUILDING_DEPARTMENT",
    orientation="h",
    color="TYPE",
    custom_data=["EmployerCounty", "wages_fmt"],
    labels={"BD_STAFF_COUNT": "BD Staff Count", "BUILDING_DEPARTMENT": "", "TYPE": "Type"},
    color_discrete_map=COLOR_MAP,
)
fig_bar.update_traces(
    hovertemplate=(
        "<b>%{y}</b><br>"
        "County: %{customdata[0]}<br>"
        "Staff:  %{x:,}<br>"
        "Wages:  %{customdata[1]}"
        "<extra></extra>"
    )
)
fig_bar.update_layout(
    yaxis={"categoryorder": "total ascending"},
    **DARK_LAYOUT,
)
fig_bar.update_xaxes(**AXIS_STYLE)
fig_bar.update_yaxes(gridcolor="rgba(0,0,0,0)", showline=False,
                     tickfont=dict(color="#cbd5e1"))

st.plotly_chart(fig_bar, use_container_width=True)


# ── Chart 2 – Scatter: Staff Count vs. Employer Population ────────────────────
st.subheader("Staff Count vs. Employer Population")
st.caption("Bubble size = total wages · Color = AHJ type · X-axis is log scale")

scatter_df = filtered[filtered["EmployerPopulation"] > 0].copy()
# Clip wages to 1 so size_max scaling works even for zero-wage rows
scatter_df["size_val"] = scatter_df["BD_STAFF_TOTAL_WAGES"].clip(lower=1)
scatter_df["wages_fmt"] = scatter_df["BD_STAFF_TOTAL_WAGES"].apply(
    lambda v: ("$" + f"{v / 1_000_000:.1f}M") if v >= 1_000_000 else ("$" + f"{v:,.0f}")
)

fig_scatter = px.scatter(
    scatter_df,
    x="EmployerPopulation",
    y="BD_STAFF_COUNT",
    color="TYPE",
    size="size_val",
    size_max=40,
    hover_name="BUILDING_DEPARTMENT",
    custom_data=["EmployerCounty", "wages_fmt", "BD_STAFF_COUNT"],
    log_x=True,
    labels={
        "EmployerPopulation": "Employer Population (log scale)",
        "BD_STAFF_COUNT":     "BD Staff Count",
        "TYPE":               "Type",
    },
    color_discrete_map=COLOR_MAP,
)
fig_scatter.update_traces(
    marker=dict(opacity=0.78, line=dict(width=0.6, color="#020617")),
    hovertemplate=(
        "<b>%{hovertext}</b><br>"
        "County:     %{customdata[0]}<br>"
        "Staff:      %{customdata[2]:,}<br>"
        "Wages:      %{customdata[1]}<br>"
        "Population: %{x:,.0f}"
        "<extra></extra>"
    ),
)
fig_scatter.update_layout(**DARK_LAYOUT)
fig_scatter.update_xaxes(**AXIS_STYLE)
fig_scatter.update_yaxes(**AXIS_STYLE)

st.plotly_chart(fig_scatter, use_container_width=True)

st.caption("Source: California Transparent Government Payroll · Processed by California Energy Commission")
`,
        },  // end files
      },    // end config
      rootEl
    );      // end stlite.mount
  </script>
</body>
</html>
